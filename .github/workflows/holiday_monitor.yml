name: Regional Holiday Monitor

on:
  schedule:
    - cron: '30 1 * * *' # 每天 UTC 01:30 运行一次（北京时间 09:30）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holiday-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      # ===== 快照持久化 =====
      - name: Restore snapshot cache
        uses: actions/cache@v3
        with:
          path: |
            game_monitor/holiday_monitor_snapshot.json
          key: holiday-snapshots-${{ github.run_id }}
          restore-keys: |
            holiday-snapshots-

      # ===== 地区节假日监控（每天 1 次）=====
      - name: Run Regional Holiday Monitor
        env:
          POPO_WEBHOOK_URL: ${{ secrets.POPO_WEBHOOK_URL }}
          CALENDARIFIC_API_KEY: ${{ secrets.CALENDARIFIC_API_KEY }}
        run: python game_monitor/holiday_monitor.py

      - name: Append run summary
        if: always()
        run: |
          echo "Workflow: holiday_monitor.yml" >> $GITHUB_STEP_SUMMARY
          echo "Completed at (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "Completed at (Asia/Shanghai): $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
