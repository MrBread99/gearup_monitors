name: Game Server Monitor

on:
  schedule:
    - cron: '0 */2 * * *' # 每 2 小时运行一次 (UTC时间)
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r game_monitor/requirements-ci.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      # ===== 快照持久化 =====
      - name: Restore snapshot cache
        uses: actions/cache@v4
        with:
          path: |
            game_monitor/game_calendar_snapshot.json
            game_monitor/platform_incidents_snapshot.json
            game_monitor/ineffective_alerts_snapshot.json
            game_monitor/detector404_level_snapshot.json
            game_monitor/monitor_workflow_heartbeat_snapshot.json
            game_monitor/russia_events_snapshot.json
            game_monitor/scrape_block_alerts_snapshot.json
          key: monitor-snapshots-${{ github.run_id }}
          restore-keys: |
            monitor-snapshots-

      # ===== 游戏网络故障 + 平台状态（每 2 小时）=====
      - name: Run Game Monitor Script
        id: game_monitor
        continue-on-error: true
        env:
          POPO_WEBHOOK_URL: ${{ secrets.POPO_WEBHOOK_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python game_monitor/monitor.py

      # ===== 俄罗斯活动预警（每 2 小时）=====
      - name: Run Russia Event Monitor
        id: russia_event
        continue-on-error: true
        env:
          POPO_WEBHOOK_URL: ${{ secrets.POPO_WEBHOOK_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python game_monitor/russia_event_monitor.py

      # ===== 新游上线 + 热游更新（每 2 小时）=====
      - name: Run Game Calendar Monitor
        id: game_calendar
        continue-on-error: true
        env:
          POPO_WEBHOOK_URL: ${{ secrets.POPO_WEBHOOK_URL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python game_monitor/game_calendar_monitor.py

      - name: Send monitor workflow heartbeat
        if: always()
        env:
          POPO_WEBHOOK_URL: ${{ secrets.POPO_WEBHOOK_URL }}
          GAME_MONITOR_OUTCOME: ${{ steps.game_monitor.outcome }}
          RUSSIA_EVENT_OUTCOME: ${{ steps.russia_event.outcome }}
          GAME_CALENDAR_OUTCOME: ${{ steps.game_calendar.outcome }}
        run: python game_monitor/workflow_heartbeat.py

      - name: Append run summary
        if: always()
        run: |
          echo "Workflow: monitor.yml" >> $GITHUB_STEP_SUMMARY
          echo "Game Monitor step: ${{ steps.game_monitor.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Russia Event step: ${{ steps.russia_event.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Game Calendar step: ${{ steps.game_calendar.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "Completed at (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "Completed at (Asia/Shanghai): $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY

      # 竞品情报（Discord + 定价）已移至独立的 competitor_radar.yml，每 24 小时运行一次。
